<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StreamFlix PRO</title>
<meta name="theme-color" content="#141414">
<link rel="manifest" href="/public/manifest.json">

<!-- CSS separado por responsabilidad -->
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/player.css">
</head>
<body class="device-desktop">

  <!-- ===== INTRO / SPLASH ===== -->
  <div id="intro-screen" class="intro-screen">
    <div class="intro-logo">STREAMFLIX</div>
  </div>

  <!-- ===== HEADER ===== -->
  <header id="main-header" class="main-header">
    <div class="header-left">
      <div class="logo">STREAMFLIX</div>
      <nav class="main-nav">
        <a href="#" data-view="home" class="nav-link active">Inicio</a>
        <a href="#" data-view="movies" class="nav-link">Películas</a>
        <a href="#" data-view="series" class="nav-link">Series</a>
        <a href="#" data-view="tvlive" class="nav-link">TV en Vivo</a>
        <a href="#" data-view="mylist" class="nav-link">Mi Lista</a>
      </nav>
    </div>
    <div class="header-right">
      <button id="search-btn" class="icon-btn" aria-label="Buscar">🔍</button>
      <button id="notif-btn" class="icon-btn" aria-label="Notificaciones">🔔</button>
      <div id="profile-menu" class="profile-menu">
        <img id="profile-avatar" src="/public/icons/avatar-default.png" alt="Perfil">
      </div>
    </div>
  </header>

  <!-- ===== BUSCADOR PREDICTIVO ===== -->
  <div id="search-overlay" class="search-overlay hidden">
    <input id="search-input" type="text" placeholder="Títulos, canales, personas...">
    <div id="search-suggestions" class="search-suggestions"></div>
  </div>

  <!-- ===== HERO BANNER ===== -->
  <section id="hero-banner" class="hero-banner">
    <div class="hero-content">
      <h1 id="hero-title" class="hero-title"></h1>
      <p id="hero-description" class="hero-description"></p>
      <div class="hero-actions">
        <button id="hero-play-btn" class="btn btn-primary">▶ Reproducir</button>
        <button id="hero-info-btn" class="btn btn-secondary">ℹ Más información</button>
      </div>
    </div>
  </section>

  <!-- ===== CONTENEDOR PRINCIPAL (vistas dinámicas) ===== -->
  <main id="app-root">

    <!-- Vista: Home (shelves / carruseles) -->
    <section id="view-home" class="view active">
      <div id="continue-watching-row" class="content-row"></div>
      <div id="shelves-container"></div>
    </section>

    <!-- Vista: Películas -->
    <section id="view-movies" class="view">
      <div class="category-filter" id="movies-category-filter"></div>
      <div id="movies-grid" class="content-grid infinite-scroll"></div>
    </section>

    <!-- Vista: Series -->
    <section id="view-series" class="view">
      <div class="category-filter" id="series-category-filter"></div>
      <div id="series-grid" class="content-grid infinite-scroll"></div>
    </section>

    <!-- Vista: TV en Vivo (TVLive) -->
    <section id="view-tvlive" class="view">
      <div class="category-filter" id="tvlive-category-filter"></div>
      <div id="tvlive-grid" class="content-grid channel-grid"></div>
      <aside id="epg-panel" class="epg-panel hidden"></aside>
    </section>

    <!-- Vista: Mi Lista -->
    <section id="view-mylist" class="view">
      <div id="mylist-grid" class="content-grid"></div>
    </section>

  </main>

  <!-- ===== MODAL DE CALIDAD ===== -->
  <div id="quality-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Selecciona la calidad</h3>
      <div id="quality-options" class="quality-options"></div>
    </div>
  </div>

  <!-- ===== MODAL DE DETALLE (info de título) ===== -->
  <div id="detail-modal" class="modal hidden">
    <div class="modal-content detail-modal-content"></div>
  </div>

  <!-- ===== PLAYER ===== -->
  <div id="player-container" class="player-container hidden">
    <video id="video-player" playsinline></video>
    <div id="player-controls" class="player-controls"></div>
    <button id="skip-intro-btn" class="skip-intro-btn hidden">Saltar intro</button>
  </div>

  <!-- ===== NOTIFICATION CENTER ===== -->
  <div id="notif-center" class="notif-center hidden"></div>

  <!-- HLS.js (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>

  <!-- ===== JS Modules (ES Modules) ===== -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
